  <!-- Android notification small icon — white tooth silhouette on transparent
       background. Android uses only the alpha (shape) channel for status bar
       icons and ignores all color, so this must be a simple solid shape with
       no background, no gradient, no fine details. The teewai tooth shape
       works perfectly as a monochrome silhouette. -->
