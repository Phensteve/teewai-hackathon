<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" role="img" aria-label="Animated whiteness index meter">
  <defs>
    <linearGradient id="wm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3a36"/>
      <stop offset="100%" stop-color="#06120f"/>
    </linearGradient>
    <linearGradient id="wm-arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#2ee6c4"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="14" fill="url(#wm-bg)"/>

  <!-- track -->
  <path d="M 70 190 A 130 130 0 0 1 330 190" fill="none" stroke="#16332f" stroke-width="18" stroke-linecap="round"/>
  <!-- gradient scale -->
  <path d="M 70 190 A 130 130 0 0 1 330 190" fill="none" stroke="url(#wm-arc)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>

  <!-- ticks -->
  <g stroke="#9fd8cc" stroke-width="2" opacity="0.5">
    <line x1="70" y1="190" x2="78" y2="184"/>
    <line x1="200" y1="60" x2="200" y2="70"/>
    <line x1="330" y1="190" x2="322" y2="184"/>
  </g>

  <!-- needle -->
  <g transform="translate(200 190)">
    <g>
      <line x1="0" y1="6" x2="0" y2="-118" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="-118" r="4" fill="#2ee6c4"/>
      <animateTransform attributeName="transform" type="rotate"
        values="-90;86;-40;70;-15;60" keyTimes="0;0.22;0.42;0.64;0.82;1"
        dur="6s" repeatCount="indefinite"/>
    </g>
    <circle r="10" fill="#0d9f8e"/>
    <circle r="4" fill="#06120f"/>
  </g>

  <!-- labels -->
  <text x="70" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9fd8cc" font-weight="700">0</text>
  <text x="200" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9fd8cc" font-weight="700">50</text>
  <text x="330" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9fd8cc" font-weight="700">100</text>
  <text x="200" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff" letter-spacing="2">WHITENESS INDEX</text>
</svg>